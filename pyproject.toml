[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyclassuml"
version = "0.1.0"
description = "Generate PlantUML class diagrams from Python projects."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
pyclassuml = "pyclassuml.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
