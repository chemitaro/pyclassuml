interface:
  display_name: "GitHub PR Merge Preparer"
  short_description: "Coordinate evidence-gated PR repair until human merge judgment"
  default_prompt: "Use $github-pr-merge-preparer to create or find the PR, observe the latest head, triage the integrated blocking batch, obtain fresh ChatGPT consultation evidence, record the orchestrator disposition and strategy delta, delegate only a bounded repair, re-observe, and report whether it is merge-prepared for human judgment. Follow the skill's semantic human gates; consultation is advisory evidence only."
